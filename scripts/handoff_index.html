<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>嫦娥项目 · 应用测试包</title><style>body{font:16px/1.7 system-ui,sans-serif;background:#f5f5fa;color:#242438;max-width:1100px;margin:40px auto;padding:0 24px}h1{font-size:32px;line-height:1.3}a{color:#6550df}nav{display:flex;gap:24px;flex-wrap:wrap;margin:24px 0}.card{padding:24px;background:white;border:1px solid #e1e1ed;border-radius:16px;margin:16px 0}input,select,button{font:inherit;padding:10px;border:1px solid #ddd;border-radius:8px}input{width:45%}details{border-top:1px solid #eee;padding:14px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#f5f5fa;padding:16px}small{color:#717187}#list{max-height:65vh;overflow:auto}.stat{color:#6550df;font-size:19px}#msg{color:#666}</style><h1>嫦娥月球钻取采样系统<br><small>档案与数据 · 应用测试交接</small></h1><nav><a href="项目文档/档案.html">阅读完整项目档案 ↗</a><a href="README-先读我.md">使用说明</a><a href="应用测试与反馈.md">六项测试任务</a><a href="字段反馈.csv" download>下载反馈表</a></nav><p>先理解项目，再按需求读取字段、证据与原件。AI 解读与应用假设须保留标记，未知值不作为零值。</p><section class="card"><div id="stats" class="stat">正在读取交付快照…</div><p id="msg">如果直接双击打开不能检索，请在本目录运行 python3 -m http.server 8780 --bind 127.0.0.1，再访问 http://127.0.0.1:8780/ 。完整档案可以直接双击阅读。</p></section><section class="card"><h2>数据检索</h2><label>范围 <select id="mode"><option value="records">原子字段</option><option value="sources">来源文件</option></select></label> <input id="q" aria-label="搜索字段、题名、来源ID" placeholder="搜索字段、题名、来源ID"><p id="count"></p><div id="list"></div></section><p>仅提供当前项目范围；专利为关联候选、图片为研究素材，非全部已审核。本地只读示例，不是在线 MCP 服务。</p><script>
let records=[],sources=[];const $=s=>document.querySelector(s);function el(tag,text){let n=document.createElement(tag);n.textContent=text;return n}function link(title,path,download=false){let a=el('a',title);a.href=path.split('/').map(encodeURIComponent).join('/');if(download)a.download='';return a}function render(){let isSource=$('#mode').value==='sources',q=$('#q').value.toLowerCase(),rows=(isSource?sources:records).filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('#count').textContent=`找到 ${rows.length} 条，当前展示前 80 条`;$('#list').replaceChildren();for(let x of rows.slice(0,80)){let d=el('details','');d.append(el('summary',isSource?`${x.title} · ${x.id}`:`${x.title} · ${x.entity} · ${x.id}`));if(isSource){let p=el('p','');p.append(link('阅读清洗文档','资料库/'+x.document),document.createTextNode('　'),link('下载原件','资料库/'+x.original,true),document.createTextNode('　'),link('读取文本块','资料库/'+x.chunks));d.append(p)}d.append(el('pre',JSON.stringify(x,null,2)));$('#list').append(d)}}async function init(){try{let [s,a,c]=await Promise.all(['交付概览.json','项目文档/原子字段档案.json','资料库/来源目录.json'].map(p=>fetch(p).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})));records=a.records;sources=c.items;$('#stats').textContent=`${s.records} 条结构化记录 · ${s.cells} 个数据单元 · ${s.source_files} 份来源文件 · ${s.papers} 篇论文 · ${s.patent_candidates} 项专利候选 · ${s.images} 项图片素材`;$('#msg').textContent=`内容 ${s.versions.content_target} / 页面 ${s.versions.page} / 归属版本 ${s.ownership_revision}。统计是入库规模，不表示研究完整度。`;render()}catch(e){$('#stats').textContent='请启动本地静态服务后检索，或直接打开完整档案。'}}$('#q').addEventListener('input',render);$('#mode').addEventListener('change',render);init();
</script></html>
