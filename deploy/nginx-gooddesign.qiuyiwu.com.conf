server {
    listen 80;
    listen [::]:80;
    server_name gooddesign.qiuyiwu.com;
    root /var/www/gooddesign.qiuyiwu.com/current;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; return 404; }
    location ~ ^/(backstage|materials|outputs|api)(/|$) { return 404; }
    location ~* \.(md|pdf|pptx|env|zip)$ { return 404; }
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache";
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    server_tokens off;
    access_log /var/log/nginx/gooddesign.qiuyiwu.com.access.log;
    error_log /var/log/nginx/gooddesign.qiuyiwu.com.error.log;
}
