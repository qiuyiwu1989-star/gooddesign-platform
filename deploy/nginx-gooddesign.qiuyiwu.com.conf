limit_req_zone $binary_remote_addr zone=gooddesign_api:10m rate=10r/m;
server {
    server_name gooddesign.qiuyiwu.com;
    root /var/www/gooddesign.qiuyiwu.com/current/public;
    index index.html;
    client_max_body_size 64k;
    location = /api/chat {
        limit_req zone=gooddesign_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3187;
        proxy_buffering off;
        proxy_read_timeout 200s;
        proxy_set_header Host $host;
    }
    location = /api/inquiry {
        limit_req zone=gooddesign_api burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3187;
    }
    location = /api/health { proxy_pass http://127.0.0.1:3187; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; return 404; }
    location ~ ^/(backstage|materials|outputs|api)(/|$) { return 404; }
    location ~* \.(md|pdf|pptx|env|zip)$ { return 404; }
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache";
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    server_tokens off;
    access_log /var/log/nginx/gooddesign.qiuyiwu.com.access.log;
    error_log /var/log/nginx/gooddesign.qiuyiwu.com.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gooddesign.qiuyiwu.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gooddesign.qiuyiwu.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = gooddesign.qiuyiwu.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name gooddesign.qiuyiwu.com;
    return 404; # managed by Certbot


}