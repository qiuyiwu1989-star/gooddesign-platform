# ML-013: public, static-only method library. Existing app/MCP untouched.
location = /methods { return 301 /methods/; }
location ^~ /methods/ {
    alias /var/www/gooddesign-methods/current/;
    index index.html;
    autoindex off;
    auth_basic off;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
