include /etc/nginx/snippets/needs-research.conf;
# Public static method library under /inno/, separate from protected case service.
location = /methods { return 301 /inno/methods/; }
location ^~ /methods/ { rewrite ^/methods/(.*)$ /inno/methods/$1 permanent; }
location = /inno/methods { return 301 /inno/methods/; }
location ^~ /inno/methods/ {
    alias /var/www/gooddesign-methods/current/;
    index index.html;
    autoindex off;
    auth_basic off;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
