# 120 起：/methods/ 直接服务内容（方法库独立 release 根），
# 旧 /inno/methods/* 由 server 级 rewrite 301 到这里。
location = /methods { return 301 /methods/; }
location ^~ /methods/ {
    alias /var/www/gooddesign-methods/current/;
    index index.html;
    autoindex off;
    auth_basic off;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
