# nginx config for haoshejiguan.com + www.haoshejiguan.com
# 好设计馆独立域名：/ 直接服务好设计馆（museum），/inno/ 镜像主项目区全部路由，
# 站内绝对链接与 <base href="/inno/legacy/"> 因此在本域名下原样可用。
# Install: sudo cp deploy/nginx-haoshejiguan.com.conf /etc/nginx/sites-available/haoshejiguan.com
#          sudo ln -sf /etc/nginx/sites-available/haoshejiguan.com /etc/nginx/sites-enabled/
# TLS:     sudo certbot --webroot -w /var/www/acme -d haoshejiguan.com -d www.haoshejiguan.com

server {
    listen 80;
    listen [::]:80;
    server_name haoshejiguan.com www.haoshejiguan.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name haoshejiguan.com www.haoshejiguan.com;

    ssl_certificate     /etc/letsencrypt/live/haoshejiguan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haoshejiguan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    charset_types text/markdown text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # 好设计馆即首页：直接服务当前 release 的 museum 页面，不做跳转
    location = / {
        auth_basic off;
        root /var/www/gooddesign-site/current/inno/museum;
        try_files /index.html =404;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 121 展厅演示应用：独立目录（单文件离线 HTML，不动 release 本体）
    location = /expo {
        return 301 /expo/;
    }
    # 123 真实 Agent 后端（SSE，限速，关缓冲）
    location ^~ /expo/api/ {
        auth_basic off;
        limit_req zone=expo_agent burst=3 nodelay;
        proxy_pass http://127.0.0.1:18792/api/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:18792;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 330s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # 129 县级地图数据：大文件，长缓存
    location ^~ /expo/geo/ {
        auth_basic off;
        alias /var/www/expo/geo/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /expo/ {
        auth_basic off;
        alias /var/www/expo/jiashan/;
        index index.html;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 120 去 /inno/ 化：旧页面路径 301 到根路径（技术路径 /inno/portal|legacy|api|mcp/api|canvas/api 不受影响）
    rewrite ^/inno$ /projects/ permanent;
    rewrite ^/inno/$ /projects/ permanent;
    rewrite ^/inno/museum/(.*)$ /museum/$1 permanent;
    rewrite ^/inno/needs-v2/(.*)$ /needs/ permanent;
    rewrite ^/inno/needs/(.*)$ /needs/$1 permanent;
    rewrite ^/inno/methods/(.*)$ /methods/$1 permanent;
    rewrite ^/inno/apps/(.*)$ /apps/$1 permanent;
    rewrite ^/inno/cases/(.*)$ /cases/$1 permanent;
    rewrite ^/inno/report/(.*)$ /report/$1 permanent;
    rewrite ^/inno/about/(.*)$ /about/$1 permanent;
    rewrite ^/inno/model/(.*)$ /model/$1 permanent;
    rewrite ^/inno/guide/(.*)$ /guide/$1 permanent;
    rewrite ^/inno/mcp/$ /mcp/ permanent;
    rewrite ^/inno/dossier/(.*)$ /dossier/$1 permanent;
    rewrite ^/inno/loop/(.*)$ /loop/$1 permanent;
    rewrite ^/inno/admin/(.*)$ /admin/$1 permanent;
    rewrite ^/inno/login/(.*)$ /login/$1 permanent;
    rewrite ^/inno/logout/(.*)$ /logout/$1 permanent;
    rewrite ^/inno/learn/(.*)$ /museum/ permanent;
    rewrite ^/inno/projects/(.*)$ /projects/ permanent;
    rewrite ^/inno/canvas/(?!api/)(.*)$ /canvas/$1 permanent;

    # 122 新旧馆整合：旧馆首页退役，legacy 展品页迁博物馆系地址
    rewrite ^/inno/legacy/(index\.html?)?$ / permanent;
    rewrite ^/inno/legacy/hall\.html$ /museum/hall permanent;
    rewrite ^/inno/legacy/categories\.html$ /museum/zones permanent;
    rewrite ^/inno/legacy/x-ray\.html$ /museum/x-ray permanent;
    rewrite ^/inno/legacy/playground\.html$ /museum/playground permanent;
    rewrite ^/inno/legacy/laureates\.html$ /museum/laureates permanent;
    rewrite ^/inno/legacy/assistant\.html$ /museum/assistant permanent;
    rewrite ^/inno/legacy/connect\.html$ /museum/connect permanent;
    rewrite ^/inno/legacy/award\.html$ /museum/award permanent;

    # 根路径公开结构（页面与运行时）
    include /etc/nginx/snippets/museum-assistant.conf;
    include /etc/nginx/snippets/inno-root.conf;
    # 主项目区技术路径（资产、API、旧路径兼容）
    include /etc/nginx/snippets/inno-readonly.conf;
    include /etc/nginx/snippets/method-library.conf;
}
