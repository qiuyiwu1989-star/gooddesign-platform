# Public project reading; originals and all APIs remain authenticated.
location = /inno { return 302 /inno/; }
location = /inno/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18776/;
    limit_except GET HEAD { deny all; }
    proxy_set_header Host 127.0.0.1:18776;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/projects/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18776/projects/;
    limit_except GET HEAD { deny all; }
    proxy_set_header Host 127.0.0.1:18776;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/dossier/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18776/dossier/;
    limit_except GET HEAD { deny all; }
    proxy_set_header Host 127.0.0.1:18776;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /inno/ {
    auth_basic "Innovation project library";
    auth_basic_user_file /etc/nginx/inno.htpasswd;
    proxy_pass http://127.0.0.1:18776/;
    limit_except GET HEAD { deny all; }
    proxy_set_header Host 127.0.0.1:18776;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
