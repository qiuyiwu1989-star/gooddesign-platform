# GoodDesign public pages, session-protected work areas and read-only MCP.
location = /inno { return 302 /inno/; }
location = /inno/projects/ { return 301 /inno/; }
location = /inno/needs-v2/ { return 301 /inno/needs/; }
location = /inno/learn/ { return 301 /inno/museum/#education; }

location = /inno/catalog.json {
    auth_basic off;
    proxy_pass http://127.0.0.1:18776/portal/catalog.json;
    proxy_set_header Host 127.0.0.1:18776;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/projects/catalog.json {
    auth_basic off;
    proxy_pass http://127.0.0.1:18776/portal/catalog.json;
    proxy_set_header Host 127.0.0.1:18776;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/portal/catalog.json {
    auth_basic off;
    proxy_pass http://127.0.0.1:18776/portal/catalog.json;
    proxy_set_header Host 127.0.0.1:18776;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /inno/ {
    auth_basic off;
    root /var/www/gooddesign-site/current;
    try_files /inno/index.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/report/ {
    auth_basic off;
    root /var/www/gooddesign-site/current;
    try_files /inno/report/index.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/mcp/ {
    auth_basic off;
    root /var/www/gooddesign-site/current;
    try_files /inno/mcp/index.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/about/ {
    auth_basic off;
    root /var/www/gooddesign-site/current;
    try_files /inno/about/index.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/model/ {
    auth_basic off;
    root /var/www/gooddesign-site/current;
    try_files /inno/model/index.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/guide/ {
    auth_basic off;
    root /var/www/gooddesign-site/current;
    try_files /inno/guide/index.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/apps/ {
    auth_basic off;
    root /var/www/gooddesign-site/current;
    try_files /inno/apps/index.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /inno/cases/ {
    auth_basic off;
    alias /var/www/gooddesign-site/current/inno/cases/;
    index index.html;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /inno/needs-v2/ {
    auth_basic off;
    alias /var/www/gooddesign-site/current/inno/needs-v2/;
    index index.html;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /inno/museum/ {
    auth_basic off;
    alias /var/www/gooddesign-site/current/inno/museum/;
    index index.html;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /inno/legacy/ {
    auth_basic off;
    alias /var/www/gooddesign-site/current/;
    index index.html;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /inno/portal/ {
    auth_basic off;
    alias /var/www/gooddesign-site/current/inno/portal/;
    add_header Cache-Control "public, max-age=60" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /inno/dossier/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18776/dossier/;
    limit_except GET HEAD { deny all; }
    proxy_set_header Host 127.0.0.1:18776;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /inno/login/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18785/login/;
    proxy_set_header Host 127.0.0.1:18785;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /inno/logout/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18785/logout/;
    proxy_set_header Host 127.0.0.1:18785;
    add_header Cache-Control "no-store" always;
}
location = /inno/auth/check {
    auth_basic off;
    internal;
    proxy_pass http://127.0.0.1:18785/auth/check;
    proxy_set_header Host 127.0.0.1:18785;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
}

location ^~ /inno/api/ {
    auth_basic off;
    auth_request /inno/auth/check;
    proxy_pass http://127.0.0.1:18776/;
    limit_except GET HEAD { deny all; }
    proxy_set_header Host 127.0.0.1:18776;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location @inno_login {
    return 302 /inno/login/?next=$request_uri;
}

location ^~ /inno/loop/ {
    auth_basic off;
    auth_request /inno/auth/check;
    error_page 401 = @inno_login;
    proxy_pass http://127.0.0.1:18784/;
    proxy_set_header Host 127.0.0.1:18784;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /inno/ {
    auth_basic off;
    auth_request /inno/auth/check;
    error_page 401 = @inno_login;
    proxy_pass http://127.0.0.1:18776/;
    limit_except GET HEAD { deny all; }
    proxy_set_header Host 127.0.0.1:18776;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /inno/mcp/api {
    auth_basic off;
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:18779/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host opendesign.cc;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
