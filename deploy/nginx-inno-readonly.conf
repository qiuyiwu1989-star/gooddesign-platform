    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /inno/portal/ {
    auth_basic off;
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:18776/portal/;
    proxy_set_header Host 127.0.0.1:18776;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=60";
}

# Remote MCP has its own revocable Bearer authentication, not browser BasicAuth.
location = /inno/mcp/api {
    auth_basic off;
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:18779/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host opendesign.cc;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
