# ---------- 运行时 ----------
location = /dossier/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18776/dossier/;
    limit_except GET HEAD { deny all; }
    proxy_set_header Host 127.0.0.1:18776;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 45s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /login/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18785/login/;
    proxy_set_header Host 127.0.0.1:18785;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /logout/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:18785/logout/;
    proxy_set_header Host 127.0.0.1:18785;
    add_header Cache-Control "no-store" always;
}
location = /auth/check {
    auth_basic off;
    internal;
    proxy_pass http://127.0.0.1:18785/auth/check;
    proxy_set_header Host 127.0.0.1:18785;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
}
location @root_login {
    return 302 /login/?next=$request_uri;
}
location ^~ /api/rc/ {
    auth_basic off;
    auth_request /auth/check;
    error_page 401 = @root_login;
    proxy_pass http://127.0.0.1:18791/api/rc/;
    proxy_set_header Host 127.0.0.1:18791;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
