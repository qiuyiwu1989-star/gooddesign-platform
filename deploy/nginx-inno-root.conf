# 120 根路径公开结构：好设计馆主域名下的去 /inno/ 化路由。
# 页面走根路径；技术路径（/inno/portal/、/inno/legacy/、/inno/api/、/inno/mcp/api）不动；
# 旧 /inno/ 页面路径由 server 级 rewrite 301 到此处对应路由。

# ---------- 静态主页类 ----------
location = /projects/ {
    auth_basic off;
    root /var/www/gooddesign-site/current/inno;
    try_files /index.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /museum/ {
    auth_basic off;
    root /var/www/gooddesign-site/current/inno/museum;
    try_files /index.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
# 122 博物馆系展品页：干净地址直出 build 根目录的 legacy 内容页
location ~ ^/museum/zones/?$ {
    auth_basic off;
    root /var/www/gooddesign-site/current;
    try_files /categories.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location = /museum/laureates {
    set $gd_year '';
    set $gd_award '';
    set $gd_q '';
    set $gd_year_sep '';
    set $gd_award_sep '';
    if ($arg_year) { set $gd_year "year=$arg_year"; }
    if ($arg_level) { set $gd_award "award=$arg_level"; }
    if ($arg_slug) { set $gd_q "q=$arg_slug"; }
    if ($arg_level) { set $gd_year_sep '&'; }
    if ($arg_slug) { set $gd_year_sep '&'; }
    if ($arg_slug) { set $gd_award_sep '&'; }
    if ($arg_year = '') { set $gd_year_sep ''; }
    if ($arg_level = '') { set $gd_award_sep ''; }
    set $gd_query "${gd_year}${gd_year_sep}${gd_award}${gd_award_sep}${gd_q}";
    return 301 /projects/?$gd_query;
}
location ~ ^/museum/(hall|x-ray|playground|assistant|connect|award)/?$ {
    auth_basic off;
    root /var/www/gooddesign-site/current;
    try_files /$1.html =404;
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
