# Dedicated same-origin museum assistant; no legacy admin/API exposure.
location = /museum/assistant/api/health {
    auth_basic off;
    proxy_pass http://127.0.0.1:3187/api/health;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
}
location = /museum/assistant/api/chat {
    auth_basic off;
    client_max_body_size 64k;
    limit_req zone=gooddesign_api burst=5 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:3187/api/chat;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 200s;
    add_header Cache-Control "no-store" always;
}
