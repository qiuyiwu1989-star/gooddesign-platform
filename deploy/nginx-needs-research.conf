# Public demand preparation is browser-local; this route accepts no writes.
location = /inno/needs { return 302 /inno/needs/; }
location = /inno/needs/ {
    auth_basic off;
    root /var/www/gooddesign-site/current;
    try_files /inno/needs-v2/index.html =404;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
