问题：'+document.getElementById('problem').value+'

下一步需明确：适用工况、约束、对标案例、验证方法。';const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='设计问题草稿.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);document.getElementById('draftStatus').textContent='问题草稿已生成下载，未提交到平台。';});</script></body></html>
