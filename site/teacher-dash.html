<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师看板 · 好设计馆教育线</title>



<style>
  :root{--ink:#16181D;--muted:#8A8F98;--muted-soft:#62666D;--line:rgba(15,23,42,.09);--accent:#5E6AD2;--accent-bright:#4F58C0;--gold:#A87E2A;--green:#3E7A5A;--red:#C03B3B;--sans:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","SF Mono",monospace;--ease:cubic-bezier(0.25,0.46,0.45,0.94);--r-md:6px;--r-lg:12px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--bg,#fff);color:var(--ink);line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  nav .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:15px;font-weight:600;color:var(--ink)}
  nav .brand .mark{width:24px;height:24px;border-radius:var(--r-md);background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
  nav .links a{color:var(--muted-soft);text-decoration:none;font-size:13.5px;padding:6px 12px;border-radius:var(--r-md)}
  @media(max-width:900px){nav .links{display:none}}
  .wrap{max-width:960px;margin:0 auto;padding:96px 28px 60px}
  h1{font-size:26px;margin-bottom:6px}
  .sub{color:var(--muted);font-size:13.5px;margin-bottom:26px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:26px}
  .c{border:1px solid var(--line);border-radius:14px;padding:16px}
  .c .v{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--accent-bright)}
  .c .k{font-size:12px;color:var(--muted);margin-top:4px}
  .q-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .q-table th,.q-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .q-table th{font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:1px}
  .q-table .rate{font-family:var(--mono);font-weight:700}
  .rate.hi{color:var(--green)} .rate.mid{color:var(--gold)} .rate.lo{color:var(--red)}
  .bar{height:6px;background:rgba(15,23,42,.06);border-radius:4px;overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;border-radius:4px}
  .empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
  footer{border-top:1px solid var(--line);color:var(--muted);padding:28px;font-size:12px;text-align:center}
</style>
<link rel="stylesheet" href="/platform.css"></head>
<body>
<header class="gd-header"><a class="gd-brand" href="/index.html"><img src="/assets/brand/logo-seal.svg" alt="" onerror="this.hidden=true"><span>好设计<small>GOOD DESIGN</small></span></a><nav class="gd-nav" aria-label="主导航"><a href="/projects.html">项目库</a><a href="/knowledge.html">知识库</a><a href="/applications.html">应用</a><a href="/about.html">关于平台</a></nav><a class="gd-search" href="/projects.html#search">搜索作品 ↗</a></header><div class="gd-note">好设计应用体验 · 互动模拟用于理解设计原理，不作为工程参数或专业仿真依据。</div>
<div class="wrap">
  <h1>📊 教师看板</h1>
  <div class="sub">闯关数据汇总(基于本机浏览器记录;如需班级数据,让学生在同一设备上作答或提供数据文件)</div>
  <div class="cards" id="cards"></div>
  <div id="body"></div>
</div>
<footer>好设计馆教育线 · 教师看板 · 数据源:本机观展闯关记录(localStorage),仅作教学参考</footer>
<script>
(function(){
  var QUESTS = window.PLAY_DATA ? window.PLAY_DATA.quest : null;
  if (!QUESTS) {
    document.getElementById('body').innerHTML = '<div class="empty">数据加载中…</div>';
    var s = document.createElement('script');
    s.src = 'js/play-data.js';
    s.onload = function(){ location.reload(); };
    document.head.appendChild(s);
    return;
  }
  function qState(slug){ try { return JSON.parse(localStorage.getItem('play-quest-' + slug) || '{}'); } catch(e){ return {}; } }
  var rows = [];
  var done = 0, answered = 0, correct = 0;
  QUESTS.forEach(function(q){
    var s = qState(q.slug);
    q.questions.forEach(function(it, i){
      var st = s.done && s.done[i];
      if (st !== undefined) { answered++; if (st) correct++; }
      rows.push({ name: q.name, q: it.q, done: st === true, wrong: st === false, none: st === undefined });
    });
    if (s.done && s.done.length === q.questions.length) done++;
  });
  var total = QUESTS.length, totalQ = QUESTS.reduce(function(a, q){ return a + q.questions.length; }, 0);
  var rate = answered ? Math.round(correct / answered * 100) : 0;
  document.getElementById('cards').innerHTML =
    '<div class="c"><div class="v">' + done + '/' + total + '</div><div class="k">通关馆藏</div></div>' +
    '<div class="c"><div class="v">' + answered + '/' + totalQ + '</div><div class="k">已答题目</div></div>' +
    '<div class="c"><div class="v">' + rate + '%</div><div class="k">总正确率</div></div>' +
    '<div class="c"><div class="v">' + (totalQ - answered) + '</div><div class="k">待作答</div></div>';
  var cls = rate >= 70 ? 'hi' : (rate >= 40 ? 'mid' : 'lo');
  var html = '<table class="q-table"><tr><th>馆藏</th><th>题目</th><th>状态</th><th>正确率</th></tr>';
  rows.forEach(function(r){
    var per = r.done ? 100 : (r.wrong ? 0 : null);
    var status = r.done ? '✅ 答对' : (r.wrong ? '❌ 答错' : '— 未答');
    var rateTxt = per === null ? '—' : '<span class="rate ' + (per === 100 ? 'hi' : 'lo') + '">' + per + '%</span>';
    var bar = per === null ? '' : '<div class="bar"><i style="width:' + per + '%;background:' + (per === 100 ? 'var(--green)' : 'var(--red)') + '"></i></div>';
    html += '<tr><td>' + r.name + '</td><td>' + r.q + '</td><td>' + status + '</td><td>' + rateTxt + bar + '</td></tr>';
  });
  html += '</table>';
  document.getElementById('body').innerHTML = answered ? html : '<div class="empty">还没有闯关记录——让学生在「互动乐园 → 观展闯关」作答后,这里会显示每题掌握情况。</div>';
})();
</script>
