<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>好设计 · 产业创新 Agent</title>
<style>
:root{--ink:#eceef3;--mut:#8a90a0;--dim:#5d6373;--acc:#7b78f0;--line:rgba(255,255,255,.08);--bg:#0b0c0f;--panel:#0e0f13}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit;background:none;border:0}
a{color:var(--acc);text-decoration:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.quiet{color:var(--dim);font-size:13px;line-height:1.8}
#home{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 10vw;transition:opacity .35s;z-index:1}
#home.off{opacity:0;pointer-events:none}
.mark{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:15px;position:fixed;top:5vh;left:10vw}
.mark img{width:30px;height:30px}
#home h1{font-size:clamp(34px,3.6vw,60px);font-weight:600;letter-spacing:-.01em;line-height:1.35}
.ask{display:flex;gap:0;margin-top:5vh;max-width:720px;border-bottom:1px solid var(--line)}
.ask input{flex:1;padding:2vh 0;font-size:clamp(20px,1.8vw,28px);outline:none;color:var(--ink)}
.ask input::placeholder{color:var(--dim)}
.ask button{color:var(--acc);font-size:clamp(15px,1.3vw,19px);padding:2vh 0 2vh 2vw;cursor:pointer}
.chips{display:flex;gap:22px;margin-top:2.4vh}
.chips button{color:var(--dim);font-size:14px;cursor:pointer;padding:0}
.chips button:hover{color:var(--acc)}
#place-choices:not(:empty){margin-top:16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.choice-title{display:block;color:var(--dim);font-size:11px;margin-bottom:6px}
#place-choices button{display:block;color:var(--mut);font-size:13px;padding:7px 0;cursor:pointer}
#place-choices button:hover{color:var(--acc)}
.modes{display:flex;gap:8px;margin-top:2vh}
.modes button{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:.35em 1em;background:transparent;cursor:pointer;transition:color .2s,border-color .2s}
.modes button:hover{color:var(--mut)}
.modes button.on{color:var(--acc);border-color:var(--acc)}
.home-foot{position:fixed;bottom:5vh;left:10vw;color:var(--dim);font-size:13px}
#history{margin-top:3vh;max-width:540px;border-top:1px solid var(--line);padding-top:14px}
.history-head{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-bottom:5px}.history-head small{font-size:10px}
#history-list{max-height:148px;overflow-y:auto;scrollbar-width:thin}
.history-item{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);color:var(--mut);font-size:11px}
.history-item b{color:var(--ink);font-weight:500}.history-item span{color:var(--dim)}.history-item small{color:var(--dim);font-variant-numeric:tabular-nums}.history-item:hover{color:var(--acc)}
@media(max-height:760px){#history{display:none}}
@media(max-width:700px){#history{max-width:none}#history-list{max-height:130px}}
#run{position:fixed;inset:0;display:none;grid-template-columns:minmax(320px,26%) 1fr;z-index:2}
#run.on{display:grid}
#logpane{border-right:1px solid var(--line);padding:5vh 2vw;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#loghead{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px;margin-bottom:3vh}
#loghead img{width:26px;height:26px}
#loghead small{display:block;color:var(--dim);font-size:12px}
#log{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:1vh;font-size:clamp(13px,1.1vw,16px);line-height:1.7}
#log .ln{color:var(--mut);opacity:0;transform:translateY(5px);transition:opacity .3s,transform .3s}
#log .ln.show{opacity:1;transform:none}
#log .ln .t{color:var(--dim);font-variant-numeric:tabular-nums;margin-right:.6em;font-size:.9em}
#log .ln.ok{color:var(--ink)}
#log .ln.warn{color:var(--mut)}
#log .ln.run::after{content:"";display:inline-block;width:.5em;height:.5em;margin-left:.5em;border-radius:50%;background:var(--acc);animation:pulse 1s infinite}
#stages{display:flex;gap:6px;margin-top:2.6vh;padding-top:2vh;border-top:1px solid var(--line)}
#stages .st{flex:1;color:var(--dim);font-size:11px;text-align:center}
#stages .st::before{content:"";display:block;height:2px;background:var(--line);margin-bottom:.6vh;transition:background .4s}
#stages .st.doing,#stages .st.done{color:var(--mut)}#stages .st.doing::before{background:var(--acc)}#stages .st.done::before{background:var(--mut)}
#elapsed{color:var(--dim);font-size:12px;margin-top:1.2vh;font-variant-numeric:tabular-nums}
#board{padding:6vh 4vw;overflow:hidden;position:relative}
.blk{display:none;height:100%;overflow:auto}
.blk.on{display:block;animation:rise .45s both}
.blk h2{font-size:clamp(26px,2.3vw,40px);font-weight:600;letter-spacing:-.01em;margin-bottom:3vh}
.blk .sub{color:var(--mut);font-size:clamp(14px,1.25vw,19px);line-height:1.8;margin-top:-2vh;margin-bottom:3vh}
table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.15vw,16px)}
td,th{padding:1.2vh .6vw;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;color:var(--mut)}
th{color:var(--dim);font-weight:400;font-size:12px}
tbody tr{opacity:0;animation:rise .4s forwards}
.rid{color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.tagp{color:var(--dim);font-size:12px;white-space:nowrap}
.sector-chips{display:flex;flex-wrap:wrap;gap:8px 20px;margin:2vh 0 3vh}
.sector-chips span{color:var(--acc);font-size:clamp(14px,1.2vw,18px);opacity:0;animation:rise .4s forwards}
.qnode{color:var(--acc);font-size:clamp(15px,1.3vw,20px);opacity:0;animation:rise .4s forwards;margin:3vh 0 1.4vh;padding-top:2vh;border-top:1px solid var(--line)}
.card{border:0;border-top:1px solid var(--line);padding:1.8vh 0;background:none;opacity:0;transform:translateY(14px);animation:rise .45s forwards}
.card h3{font-size:clamp(16px,1.4vw,21px);font-weight:600;margin-bottom:.8vh;line-height:1.5}
.card p,.card li{color:var(--mut);font-size:clamp(13px,1.1vw,16px);line-height:1.75}
.card ul{list-style:none;margin-top:1vh}
.card li::before{content:"·";color:var(--acc);margin-right:.5em}
.award{color:var(--mut);font-size:12px;display:block;margin-bottom:.6vh}
.lk{display:block;color:var(--acc);font-size:clamp(12px,1.05vw,15px);margin-top:1vh;line-height:1.6}
.lk::before{content:"迁移点 · ";color:var(--dim)}
.df{display:block;color:var(--dim);font-size:clamp(12px,1.05vw,15px);margin-top:.5vh;line-height:1.6}
.df::before{content:"差异 · "}
.vf{display:block;color:var(--mut);font-size:clamp(12px,1.05vw,15px);margin-top:1vh}
.vf::before{content:"先验证 · ";color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 2.4vw}
.grid.two{grid-template-columns:repeat(2,1fr)}
.datatag{margin-top:3vh}
#report{position:fixed;inset:0;display:none;background:var(--bg);z-index:3;grid-template-columns:230px 1fr}
#report.on{display:grid}
#rtoc{border-right:1px solid var(--line);padding:5vh 1.4vw;overflow:auto;background:var(--panel)}
#rtoc .rt-brand{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px;margin-bottom:3vh}
#rtoc .rt-brand img{width:24px;height:24px}
#rtoc a{display:block;color:var(--dim);font-size:13px;padding:.8vh .4vw;border-radius:6px}
#rtoc a:hover{color:var(--ink)}
#rbody{overflow:auto;padding:5vh 4.5vw 14vh}
#rbody .rdoc{max-width:1000px}
.rsec{margin-bottom:5vh;scroll-margin-top:3vh;opacity:0;transform:translateY(12px);animation:rise .45s forwards}
.rsec h2{font-size:clamp(20px,1.8vw,28px);font-weight:600;margin-bottom:2vh}
.rsec .lead{color:var(--mut);font-size:clamp(14px,1.25vw,18px);line-height:1.9}
.rhead{padding-bottom:3vh;margin-bottom:4vh;border-bottom:1px solid var(--line)}
.rhead h1{font-size:clamp(28px,2.8vw,46px);font-weight:600;letter-spacing:-.01em;line-height:1.35;margin-bottom:1.6vh}
.rhead .meta{color:var(--dim);font-size:13px;line-height:1.9}
.rstats{display:flex;gap:3.5vw;margin:3vh 0;padding:2.4vh 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rstats b{font-size:clamp(28px,2.6vw,44px);font-weight:600;display:block}
.rstats span{color:var(--dim);font-size:12px}
.estrip{color:var(--dim);font-size:13px;line-height:1.9;margin-top:2.4vh}
#rbar{position:fixed;left:230px;right:0;bottom:0;background:rgba(11,12,15,.96);border-top:1px solid var(--line);padding:1.4vh 4.5vw;display:none;justify-content:space-between;align-items:center;z-index:4}
#report.on ~ #rbar,body.report-mode #rbar{display:flex}
#rbar .qr{display:flex;gap:1.4vw}
#rbar .qr img{width:56px;border-radius:6px;background:#fff;padding:3px}
#rbar .qr span{display:block;color:var(--dim);font-size:11px;margin-top:.4vh;text-align:center}
.rbtn{color:var(--acc);font-size:15px;cursor:pointer;padding:1vh 0}
.rbtn.ghost{color:var(--dim);margin-right:2.4vw}
/* 140 浅色阅读版：只作用于报告，不改变首页和运行页 */
body.report-mode{--ink:#1b1e24;--mut:#505762;--dim:#7b828c;--acc:#514bb7;--line:#e2e4e8;--bg:#f2f3f5;--panel:#fff;background:var(--bg)}
body.report-mode #report{background:var(--bg)}
body.report-mode #rtoc{background:#fff}
body.report-mode #rtoc a:hover{background:#f4f4f8}
body.report-mode #rbody{background:#f2f3f5;padding:40px 4vw 130px}
body.report-mode #rbody .rdoc{max-width:1040px;margin:0 auto;padding:0 48px 52px;background:#fff;box-shadow:0 12px 44px rgba(25,30,40,.07)}
body.report-mode .rcover{min-height:0;padding:64px 0 48px;margin-bottom:0}
body.report-mode .rsec{margin-bottom:58px}
body.report-mode .rsec:last-child{margin-bottom:0}
body.report-mode .table-wrap{background:#fff}
body.report-mode .table-wrap th{background:#f6f7f8}
body.report-mode .fact-card,body.report-mode .chain-tier{background:#fff}
body.report-mode #rbar{background:rgba(255,255,255,.96)}
/* 137 正式报告的咨询版式与项目关系 */
.rcover{position:relative}.cover-share{display:flex;align-items:center;gap:14px;margin-top:30px;color:var(--mut);font-size:12px;line-height:1.6}
.cover-share img{width:84px;height:84px;padding:4px;background:#fff;border-radius:8px}.cover-share small{display:block;color:var(--dim);font-size:10px;word-break:break-all;max-width:420px}
.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;margin:18px 0 24px;background:rgba(255,255,255,.012)}
.table-wrap table{margin:0}.table-wrap th{padding-top:14px;padding-bottom:14px;letter-spacing:.04em;background:rgba(255,255,255,.025)}
.table-wrap tbody tr{transition:background .18s}.table-wrap tbody tr:hover{background:rgba(255,255,255,.025)}
.fact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.fact-card{border:1px solid var(--line);border-radius:12px;padding:18px;background:rgba(255,255,255,.018)}
.fact-card .fv{font-size:22px;font-weight:600;color:var(--ink);margin:4px 0}.fact-card .fl{color:var(--dim);font-size:11px}.fact-card p{color:var(--mut);font-size:12px;line-height:1.65}.fact-card a{font-size:11px;display:inline-block;margin-top:8px}
.benchmarks{display:grid;gap:0;margin-top:20px}.benchmark{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:16px 0;border-top:1px solid var(--line)}.benchmark b{font-weight:600}.benchmark p{color:var(--mut);font-size:13px}.benchmark small{color:var(--dim);display:block;margin-top:5px}
.relation-flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative;margin:26px 0 12px}
.relation-flow::before{content:"";position:absolute;left:5%;right:5%;top:50%;height:1px;background:var(--line);z-index:-1}
.relation-flow div{padding:14px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:76px}
.relation-flow b{display:block;font-size:12px;font-weight:600;color:var(--ink)}.relation-flow span{display:block;color:var(--dim);font-size:10px;line-height:1.55;margin-top:6px}
.decision-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:24px 0}
.decision-grid section{padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.decision-grid section>span{color:var(--acc);font-size:11px}.decision-grid h3{font-size:16px;line-height:1.55;margin:9px 0}.decision-grid p,.decision-grid li{color:var(--mut);font-size:12px;line-height:1.75}.decision-grid ul{padding-left:17px}
.evidence-note{display:block;color:var(--dim);font-size:11px;line-height:1.65;margin-top:6px}
.pilot-framework{margin-top:26px;padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.pilot-framework>h3{font-size:16px;margin-bottom:14px}.pilot-framework>h3 span{color:var(--dim);font-size:10px;font-weight:400;margin-left:8px}
.pilot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.pilot-grid div{border-top:1px solid var(--line);padding-top:12px}.pilot-grid b{font-size:12px}.pilot-grid p{color:var(--mut);font-size:11px;line-height:1.7;margin-top:5px}
@media print{.decision-grid,.pilot-framework,.pilot-grid div{break-inside:avoid}.decision-grid{gap:3mm}.decision-grid section{padding:4mm}.pilot-framework{padding:4mm}.pilot-grid{gap:3mm}.evidence-note{font-size:8pt}}
@media(max-width:700px){.decision-grid,.pilot-grid{grid-template-columns:1fr}}
@media print{.relation-flow{break-inside:avoid;gap:2mm}.relation-flow div{padding:3mm;min-height:0}.relation-flow b{font-size:8pt}.relation-flow span{font-size:7pt}}
@media(max-width:700px){.relation-flow{grid-template-columns:1fr}.relation-flow::before{display:none}}
.chain-visual{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0 30px}.chain-tier{border:1px solid var(--line);border-radius:12px;padding:18px;background:rgba(255,255,255,.018)}
.chain-tier>span{display:block;color:var(--acc);font-size:12px;margin-bottom:12px}.chain-link{padding:9px 0;border-top:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1.6}
.project-card{display:grid;grid-template-columns:140px minmax(0,1fr) 84px;gap:20px;padding:20px 0;border-top:1px solid var(--line);align-items:start}
.project-cover{width:140px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--panel)}.project-cover.empty{display:grid;place-items:center;color:var(--dim);font-size:11px}
.project-body h3{font-size:17px;line-height:1.5;margin:4px 0 8px}.project-body>p{color:var(--mut);font-size:12px;line-height:1.7}.project-relations{margin-top:10px}.project-relations span{display:block;font-size:12px;line-height:1.7;margin-top:5px}.project-relations .pl{color:var(--acc)}.project-relations .pd{color:var(--dim)}
.project-side{text-align:center}.project-side img{width:76px;height:76px;padding:3px;background:#fff;border-radius:6px}.project-side a{font-size:10px;display:block;margin-top:6px;word-break:break-all}.project-unit{font-size:10px;color:var(--dim);margin-top:8px}
.appendix-project{display:grid;grid-template-columns:1fr 72px;gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}.appendix-project img{width:64px;height:64px;padding:3px;background:#fff;border-radius:6px}.appendix-project b{display:block;font-weight:500}.appendix-project small{color:var(--dim);display:block;margin-top:4px}.appendix-project a{font-size:11px;display:inline-block;margin-top:6px}
@media print{.cover-share img{width:26mm;height:26mm}.cover-share{break-inside:avoid}.table-wrap{border:0!important;border-radius:0!important;overflow:visible!important}.table-wrap th{background:#f3f3f3!important;print-color-adjust:exact}.fact-card,.chain-tier,.project-card,.appendix-project{break-inside:avoid;page-break-inside:avoid}.fact-grid{gap:4mm}.fact-card,.chain-tier{padding:4mm;border-color:#ddd!important}.project-card{grid-template-columns:32mm 1fr 22mm;gap:4mm}.project-cover{width:32mm}.project-side img{width:20mm;height:20mm}.chain-visual{gap:3mm}.chain-tier>span{color:#333!important}.chain-link{color:#333!important}}
@media(max-width:700px){.fact-grid,.chain-visual,.relation-flow,.decision-grid,.pilot-grid{grid-template-columns:1fr}.project-card{grid-template-columns:88px minmax(0,1fr);gap:12px}.project-cover{width:88px}.project-side{grid-column:1/-1;display:flex;align-items:center;gap:12px;text-align:left}.project-side a{word-break:normal}.cover-share small{max-width:200px}}
@media print{
  @page{size:A4;margin:17mm 15mm 18mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#111!important}
  #home,#run,#rtoc,#rbar,.mark,.home-foot,#run-controls{display:none!important}
  #report,#report.on{position:static!important;display:block!important;inset:auto!important;grid-template-columns:none!important;background:#fff!important;overflow:visible!important}
  #rbody{overflow:visible!important;padding:0!important;width:100%!important}
  #rbody .rdoc{max-width:none!important;width:100%!important;margin:0!important}
  body.report-mode #rbody .rdoc{padding:0!important;box-shadow:none!important;background:#fff!important}
  .rsec{opacity:1!important;transform:none!important;animation:none!important;margin:0 0 9mm;scroll-margin:0}
  body.report-mode .rsec{margin-bottom:9mm!important}
  .rcover{min-height:238mm;display:flex;flex-direction:column;justify-content:center;padding:0!important;border:0!important;break-after:page;page-break-after:always}
  body.report-mode .rcover{min-height:238mm!important;padding:0!important}
  .rcover h1,.rsec h2,.card h3,td b{color:#111!important}
  .rcover h1{font-size:30pt!important;line-height:1.35!important;max-width:155mm}
  .rcover-sub{font-size:14pt!important;color:#444!important}
  .rcover-meta{font-size:9pt!important;line-height:1.9!important;color:#555!important}
  .rsec h2{font-size:18pt!important;margin:0 0 7mm!important;break-before:page;page-break-before:always}
  #rs-sum h2{break-before:auto;page-break-before:avoid}
  .rsec .lead,p,li,td,th,.sub,.quiet,.estrip{color:#333!important}
  .rsec .lead{font-size:11pt!important;line-height:1.8!important}
  table{width:100%!important;table-layout:auto!important;border-collapse:collapse!important;font-size:9.5pt!important}
  td,th{padding:3.2mm 2.4mm!important;border-bottom:1px solid #d8d8d8!important;line-height:1.55!important;vertical-align:top!important;word-break:normal!important;overflow-wrap:anywhere!important}
  th{font-size:8pt!important;color:#666!important;font-weight:500!important}
  td.rid{width:12mm!important;white-space:nowrap!important;color:#555!important}
  td.tagp{width:34mm!important;white-space:normal!important;font-size:8.5pt!important}
  tr,.card,.mgroup,.rstats{break-inside:avoid;page-break-inside:avoid}
  tbody tr{opacity:1!important;animation:none!important}
  .rstats{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:5mm!important;border-top:1px solid #bbb!important;border-bottom:1px solid #bbb!important;padding:5mm 0!important}
  .rstats b{font-size:22pt!important;color:#111!important}.rstats span{color:#666!important;font-size:8pt!important}
  .grid,.grid.two{grid-template-columns:1fr!important;gap:0!important}

  .card p,.card li,.lk,.df,.vf{font-size:9.5pt!important;color:#333!important}

  a{color:#222!important;text-decoration:none!important}
  .datatag{margin-top:5mm!important}
}
/* 多 Agent 节点图 */
#graph{padding:1vh 0 4vh;border-bottom:1px solid var(--line);margin-bottom:4vh;display:flex;align-items:stretch;overflow-x:auto}
.gnode{flex:none;display:flex;flex-direction:column;align-items:center;gap:.7vh;width:88px;opacity:.3;transition:opacity .4s}
.gnode .ava{width:60px;height:64px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;background:var(--panel);position:relative;transition:border-color .3s,box-shadow .3s}
.gnode .glyph{font-size:22px;color:var(--mut)}

.research-card{cursor:pointer}.research-card:focus-visible{outline:1px solid var(--role,var(--acc));outline-offset:3px}

.role-frequency{display:block;color:var(--dim);font-size:10px;margin-top:6px}

<body>
<button id="fullscreen-exit" type="button" aria-label="退出纯净全屏展示">退出全屏</button>

<div id="home">
  <div class="mark"><img id="ip-logo" alt=""><span>好设计 · 小好深研</span></div>
  <div class="home-wrap">
    <div>
      <h1>输入一个地方产业。</h1>
      <div class="ask">
        <input id="q" placeholder="比如：玉环" autocomplete="off" autofocus>
        <button id="go" type="button">研究</button>
      </div>
      <div id="place-choices" aria-live="polite"></div>
      <div class="chips" id="place-chips"></div>
      <div class="modes" id="modes" role="group" aria-label="研究深度">
        <button data-d="scan" type="button">速览 · 约1分钟</button>
        <button data-d="standard" type="button" class="on">标准 · 约2分钟</button>
        <button data-d="deep" type="button">深研 · 约5分钟</button>
      </div>
      <div class="home-foot" style="position:static;margin-top:4vh">好设计 · 560 个获奖项目档案</div>

</div>

<div id="run">
  <div id="run-controls"><button id="back" type="button">返回</button><button id="pause" type="button">暂停</button></div>
  <div id="logpane">
    <div id="loghead"><img id="ip-logo2" alt=""><span>小好 · AI研究统筹</span><small id="logtarget"></small></div>
    <div id="orchestrator">
      <div class="orch-current"><span class="orch-pulse"></span><span id="run-state">执行中</span></div>
      <div class="orch-goal" id="orch-goal">正在明确研究目标</div>
      <div class="orch-meta"><span id="orch-stage">准备开始</span><span id="orch-work">0 项过程</span></div>
      <div class="depth-panel" aria-label="研究覆盖深度">
        <div><span>公开资料</span><b id="depth-sources">—</b></div>

    <div class="blk" id="blk-s3"></div>
    <div class="blk" id="blk-s4"></div>

<div id="report">

</div>

  <div style="display:flex;gap:12px;align-items:center">
    <button class="rbtn" id="btn-save" type="button">保存 HTML</button>
    <button class="rbtn" id="btn-archive" type="button">收录后台</button>
    <button class="rbtn ghost" id="btn-print" type="button">打印 / 存 PDF</button>

<script>/*__EXPO_QR_LIB__*/</script>
<script>
const D = /*__EXPO_AGENT_DATA__*/;
const $ = s => document.querySelector(s);
document.getElementById('ip-logo').src = D.ip_logo;
document.getElementById('ip-logo2').src = D.ip_logo;

const home = $('#home'), run = $('#run'), report = $('#report'), logEl = $('#log'), stagesEl = $('#stages');
const STAGE_NAMES = ['破题', '侦察', '拆解', '求证', '映射', '综合', '成稿'];
let clock = null, t0 = 0;

$('#place-chips').innerHTML = Object.keys(D.places).filter(k => !k.startsWith('_')).map(k =>
  `<button data-p="${k}">${D.places[k].label}</button>`).join('');
document.querySelectorAll('#place-chips button').forEach(b =>
  b.addEventListener('click', () => { $('#q').value = b.dataset.p; start(b.dataset.p); }));
$('#go').addEventListener('click', () => start($('#q').value.trim()));
let DEPTH = 'standard';
const DEPTH_NAME = { scan: '速览', standard: '标准', deep: '深研' };
document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', () => {
  DEPTH = b.dataset.d;
  document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b));
}));
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') start($('#q').value.trim()); });

function pickPlace(q) {
  if (!q) return 'yuhuan';
  for (const k of Object.keys(D.places)) if (q.includes(D.places[k].label) || q.includes(k)) return k;
  return '_generic';
}
function cachedPlace(q) {
  const query = (q || '').trim();
  if (LIT[query]) return query;
  for (const [k, p] of Object.entries(D.places)) {
    if ((query === k || query === p.label) && LIT[p.label]) return p.label;
  }
  return null;
}
const pj = id => (LIVE.pack && LIVE.pack.projects && LIVE.pack.projects[id]) || D.projects[id] || { name: id, award: '待核', unit: '', summary: '', cover: '', research: false };
const projectUrl = id => (D.base_url || 'https://haoshejiguan.com') + '/dossier/?project=' + encodeURIComponent(id);
const REPORT_SLUGS = { '玉环': 'yuhuan', '嘉善': 'jiashan', '绍兴': 'shaoxing', '嘉兴': 'jiaxing', '天台': 'tiantai', '台州': 'taizhou', '杭州市西湖区': 'hangzhou-xihu', '南昌市西湖区': 'nanchang-xihu' };
const PLACE_LABELS = Object.fromEntries(Object.entries(REPORT_SLUGS).map(([label, slug]) => [slug, label]));
function placeLabel(value) {
  return PLACE_LABELS[value] || value;
}
function reportSlug(label) {
  if (REPORT_SLUGS[label]) return REPORT_SLUGS[label];
  const hex = [...new TextEncoder().encode(label)].map(b => b.toString(16).padStart(2, '0')).join('');
  let hash = 2166136261;
  for (const byte of new TextEncoder().encode(label)) { hash ^= byte; hash = Math.imul(hash, 16777619); }
  return 'report-' + (hash >>> 0).toString(16) + '-' + hex.slice(0, 12);
}
function qrData(text, size = 128) {
  const host = document.createElement('div');
  new QRCode(host, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  const canvas = host.querySelector('canvas');
  if (!canvas) return '';
  const framed = document.createElement('canvas');
  const margin = Math.max(8, Math.round(size / 12));
  framed.width = size + margin * 2;
  framed.height = size + margin * 2;
  const ctx = framed.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, framed.width, framed.height);
  ctx.drawImage(canvas, margin, margin, size, size);
  return framed.toDataURL('image/png');
}
function renderReportQr() {
  const qr = qrData(LIVE.reportUrl, 128);
  $('#report-qr').innerHTML = `<div><img src="${qr}" alt="本报告二维码"><span>扫码打开并保存本报告</span></div>`;
  const cover = $('#cover-qr');
  if (cover) cover.src = qr;
  const url = $('#cover-url');
  if (url) url.textContent = decodeURIComponent(LIVE.reportUrl);
}
function statusChip(s) {
  const map = { supported: ['依据较充分', 'st-ok'], partial: ['部分印证', 'st-mid'], unknown: ['待进一步核实', 'st-dim'] };
  const [label, cls] = map[s] || map.unknown;
  return `<span class="stchip ${cls}">${label}</span>`;
}
function basisText(text) {
  return String(text || '').replace(/^关联：(?:[0-9a-z-]+)\s+/i, '案例依据：').replace(/^关联：/, '案例依据：');
}
async function sleep(ms) {
  let remaining = ms;
  while (remaining > 0) {
    if (LIVE.paused) { await new Promise(r => setTimeout(r, 100)); continue; }
    const step = Math.min(remaining, 100);
    await new Promise(r => setTimeout(r, step));
    remaining -= step;
  }
}

function updateOrchestrator() {
  $('#orch-work').textContent = (LIVE.processCount || 0) + ' 项过程';
  document.querySelectorAll('.work-total').forEach(el => { el.textContent = LIVE.processCount || 0; });
  $('#orch-stage').textContent = Number.isInteger(LIVE.currentStage) ? String(LIVE.currentStage + 1).padStart(2, '0') + ' / 07 · ' + STAGE_NAMES[LIVE.currentStage] : '准备开始';
  $('#run-state').textContent = LIVE.paused ? '已暂停' : '执行中';
}
function typeLog(text, cls = '') {
  const ln = document.createElement('div');
  ln.className = 'ln ' + cls;
  const icon = document.createElement('span');
  icon.className = 'picon';
  const body = document.createElement('div');
  const stage = document.createElement('span');
  stage.className = 'pstage';
  stage.textContent = Number.isInteger(LIVE.currentStage) ? STAGE_NAMES[LIVE.currentStage] + ' · ' + (AGENTS.find(a => a.id === STAGE_AGENT[LIVE.currentStage])?.name || '小好') : '小好';
  const tx = document.createElement('span');
  tx.className = 'tx';
  tx.textContent = text;
  body.append(stage, tx);
  ln.append(icon, body);
  logEl.appendChild(ln);
  requestAnimationFrame(() => { ln.classList.add('show'); logEl.scrollTop = logEl.scrollHeight; });
  while (logEl.children.length > 60) logEl.removeChild(logEl.firstChild);
  LIVE.processCount = (LIVE.processCount || 0) + 1;
  $('#action-text').textContent = text;
  if (Number.isInteger(LIVE.currentStage)) addAgentNote(STAGE_AGENT[LIVE.currentStage], text);
  updateOrchestrator();
  return ln;
}
function upsertThinking(text, stageIndex) {
  let ln = document.getElementById('thinking-' + stageIndex);
  if (!ln) {
    ln = typeLog(text, 'thinking');
    ln.id = 'thinking-' + stageIndex;
  } else {
    ln.querySelector('.tx').textContent = text;
  }
  requestAnimationFrame(() => { logEl.scrollTop = logEl.scrollHeight; });
}
function setStage(i, state) {
  LIVE.currentStage = i;
  $('#orch-goal').textContent = THOUGHTS[i].title;
  updateOrchestrator();
  [...stagesEl.children].forEach((el, k) => {
    el.classList.toggle('doing', k === i && state === 'doing');
    el.classList.toggle('done', k < i || (k === i && state === 'done'));
  });
  if (state === 'doing') { LIVE.lastActivity = ''; graphWork(STAGE_AGENT[i]); showThink({ stage: i, progress: 0 }); }
  if (state === 'done') graphDone(STAGE_AGENT[i]);
}
function showBlk(id) {
  document.querySelectorAll('.blk').forEach(b => b.classList.remove('on'));
  const el = document.getElementById(id);
  void el.offsetWidth;
  el.classList.add('on');
}
const awardCls = a => a === '金奖' ? '' : (a === '银奖' ? 'silver' : 'elite');

/* ---------- 报告装配（与阶段内容同一份真源，结构按 specs/131） ---------- */
function fmtDur(s) {
  if (s == null) return '—';
  return Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
}
function workline(P) {
  const M = P.metrics || {};
  const ts = M.theses_status || {};
  const seg = [];
  if (M.scanned != null) seg.push(`检索深入研究档案 ${M.scanned} 个（项目库共 ${M.catalog} 项）`);
  if (M.terms != null) seg.push(`使用 ${M.terms} 组检索线索，开展 ${M.retrieval_rounds || 1} 轮检索`);
  if (M.sources != null) seg.push(`查阅 ${M.sources} 条公开资料`);
  if (M.theses != null) seg.push(`核查 ${M.theses} 条初步判断（依据较充分${ts.supported || 0}/部分印证${ts.partial || 0}/待核实${ts.unknown || 0}）`);
  if (M.matches != null) seg.push(`形成 ${M.matches} 条案例关联`);
  if (M.model_calls != null) seg.push(`智能分析 ${M.model_calls} 次（联网核查 ${M.web_calls || 0} 次）`);
  if (M.elapsed_s != null) seg.push(`用时 ${fmtDur(M.elapsed_s)}`);
  return seg.join(' · ');
}
function buildReport(P, query) {
  P.label = placeLabel(P.label);
  LIVE.pack = P;
  const today = new Date().toISOString().slice(0, 10);
  const nMatch = P.matches.reduce((n, m) => n + m.projects.length, 0);
  const depthCode = { scan: 'S', standard: 'N', deep: 'D' }[P.depth] || 'N';
  LIVE.reportId = P.report_id || 'demo-' + reportSlug(P.label);
  const versionCode = LIVE.reportId.slice(-4).toUpperCase();
  const reportNo = `GD-DR-${today.replace(/-/g, '')}-${P.label}-${depthCode}-${versionCode}`;
  LIVE.reportNo = reportNo;
  LIVE.reportDate = today;
  LIVE.reportUrl = 'https://haoshejiguan.com/expo/?report=' + (P.slug || reportSlug(P.label)) + '&id=' + encodeURIComponent(LIVE.reportId);
  document.title = P.label + '产业 × 好设计创新研究报告';
  const M = P.metrics || {};
  const firstOp = P.opportunities[0] || null;
  const demandExamples = P.requirements.slice(0, 3);
  const caseExamples = [...new Set(P.matches.flatMap(m => m.projects.map(r => r.id)))].slice(0, 3).map(id => pj(id));
  const toc = [
    ['rs-sum', '管理层摘要'], ['rs-design', '1 研究思路'], ['rs-ov', '2 产业发展基础'],
    ['rs-chain', '3 产业链与重点企业'], ['rs-req', '4 企业需求与主要制约'], ['rs-map', '5 优秀案例的借鉴价值'],
    ['rs-op', '6 创新方向与试点建议'], ['rs-src', '7 主要资料来源'], ['rs-risk', '8 需要注意的问题'],
    ['rs-ap', '附录A 参考案例'], ['rs-wl', '附录B 研究工作说明'], ['rs-term', '附录C 阅读说明'],
  ];
  $('#rtoc').innerHTML = `<a class="rt-brand" href="/expo/" aria-label="返回产业研究首页"><img src="${D.ip_logo}" alt=""><span>好设计</span></a>` +
    toc.map(([id, t]) => `<a href="#${id}">${t}</a>`).join('');
  $('#rdoc').innerHTML = `
  <div class="rcover rsec">
    <p class="quiet" style="letter-spacing:.08em">${reportNo} · ${M.elapsed_s != null ? '决策参考 · 内部研究稿' : '案例演示 · 内部研究稿'}</p>
    <h1>${P.label}产业 × 好设计创新研究报告</h1>
    <p class="rcover-sub">产业调研与创新路径研究</p>
    <div class="rcover-meta">
      <span>研究支持：好设计 · 小好深研</span>
      <span>日期：${today}</span>
      ${P.target && P.target.industry ? `<span>研究对象：${P.target.region} · ${P.target.industry}</span>` : ''}
      <span>研究方式：${DEPTH_NAME[P.depth] || '标准'}（速览=快速梳理 / 标准=公开资料核查 / 深研=重点企业逐项核查）</span>
      <span>研究路径：产业摸底 → 结构分析 → 需求研判 → 案例对照 → 方向论证 → 形成报告</span>
      <span>使用说明：本报告供决策参考，重要事项建议结合实地调研与部门会商进一步研判</span>
    </div>
    <div class="cover-share"><img id="cover-qr" alt="本报告二维码"><div>扫码阅读这份报告<small>可保存独立 HTML · 参考案例可继续查阅</small><small id="cover-url"></small></div></div>
  </div>
  <div class="rsec" id="rs-sum"><h2>管理层摘要</h2>
    <p class="lead">${P.headline} ${P.intro}</p>

function geomPath(g) {
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
  let d = '';
  for (const poly of polys || []) {
    for (const ring of poly || []) {
      if (!ring || !ring.length) continue;
      d += 'M' + ring.map(pt => { const p = proj(pt[0], pt[1]); return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join('L') + 'Z';
    }
  }

function drawInset(svg, provs, ctys) {
  const jd = provs.filter(f => f.properties.level === 'nine-dash');
  const isl = ctys.filter(f => f.properties.centroid && f.properties.centroid[1] < 17.3);
  if (!jd.length && !isl.length) return;
  let mnx = 999, mny = 999, mxx = -999, mxy = -999;
  const walk = o => {
    if (typeof o[0] === 'number') {
      mnx = Math.min(mnx, o[0]); mxx = Math.max(mxx, o[0]);
      mny = Math.min(mny, o[1]); mxy = Math.max(mxy, o[1]);
    } else o.forEach(walk);
  };
  [...jd, ...isl].forEach(f => walk(f.geometry.coordinates));
  if (mnx > mxx) return;
  const bw = mxx - mnx, bh = mxy - mny;
  const bx = MAPW - 96, by = MAPH - 116, bwpx = 88, bhpx = 108;
  const s = Math.min(bwpx / bw, bhpx / bh);
  const ox = bx + (bwpx - bw * s) / 2, oy = by + (bhpx - bh * s) / 2;
  const g = document.createElementNS(NS, 'g');
  const box = document.createElementNS(NS, 'rect');
  box.setAttribute('class', 'inset-box');
  box.setAttribute('x', bx - 6); box.setAttribute('y', by - 6);
  box.setAttribute('width', bwpx + 12); box.setAttribute('height', bhpx + 12);
  box.setAttribute('rx', 8);
  g.appendChild(box);
  const small = (geo, cls) => {
    const polys = geo.type === 'Polygon' ? [geo.coordinates] : geo.coordinates;
    let d = '';
    for (const poly of polys || []) for (const ring of poly || []) {
      if (!ring || !ring.length) continue;
      d += 'M' + ring.map(pt => ((pt[0] - mnx) * s + ox).toFixed(1) + ' ' + ((mxy - pt[1]) * s + oy).toFixed(1)).join('L') + 'Z';
    }
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d); p.setAttribute('class', cls);
    g.appendChild(p);
  };
  isl.forEach(f => small(f.geometry, 'cty'));
  jd.forEach(f => small(f.geometry, 'jdl'));
  const cap = document.createElementNS(NS, 'text');
  cap.setAttribute('class', 'plabel');
  cap.setAttribute('x', bx + bwpx / 2); cap.setAttribute('y', by + 10);
  cap.setAttribute('font-size', '7');
  cap.textContent = '南海诸岛';
  g.appendChild(cap);
  svg.appendChild(g);
}

async function deliveryDocument() {
  const clone = document.getElementById('rdoc').cloneNode(true);
  clone.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (!href.startsWith('#')) a.setAttribute('href', new URL(href, 'https://haoshejiguan.com/expo/').href);
  });
  for (const img of clone.querySelectorAll('img[src^="http"]')) {
    try {
      const resp = await fetch(img.src);
      if (!resp.ok) continue;
      const blob = await resp.blob();
      img.src = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    } catch (e) { /* 无法取得的封面保留线上地址，不伪造图片 */ }
  }
  const nav = [...document.querySelectorAll('#rtoc a[href^="#"]')].map(a => `<a href="${a.getAttribute('href')}">${a.textContent}</a>`).join('');
  return `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${LIVE.pack.label}产业 × 好设计创新研究报告</title><style>${DELIVERY_CSS}</style></head><body><div class="delivery-shell"><header class="delivery-brand"><b>好设计 · 小好深研</b><span>${LIVE.reportNo} · 内部讨论稿</span><a href="https://haoshejiguan.com/expo/">返回产业研究首页</a></header><nav class="delivery-nav">${nav}</nav><main class="delivery-doc">${clone.innerHTML}</main><footer class="delivery-foot"><span>${LIVE.reportNo}</span><span>本报告供决策参考，重要事项请结合实地调研与专题论证</span></footer></div></body></html>`;
}
async function saveReportHtml() {
  if (!LIVE.pack) return;
  const btn = $('#btn-save');
  btn.disabled = true;
  btn.textContent = '正在打包…';
  const blob = new Blob([await deliveryDocument()], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = LIVE.reportNo + '.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  btn.disabled = false;
  btn.textContent = '已保存 HTML';
  setTimeout(() => { btn.textContent = '保存 HTML'; }, 1800);
}

async function start(query, force = false) {
  const choices = ambiguousPlaces(query);
  if (choices.length > 1) { showPlaceChoices(choices); return; }
  showPlaceChoices([]);
  if (!force) {
    await litReady;
    const cached = cachedPlace(query || '玉环');
    if (cached) return openReport(cached);
  }
  if (LIVE.source) LIVE.source.close();
  DONE_RECEIVED = false;
  resetPlayback();
  const key = pickPlace(query || 'yuhuan');
  const fallbackP = D.places[key] || D.places._generic;
  const target = parseResearchTarget(query || fallbackP.label);
  LIVE.target = target;
  LIVE.query = target.label;
  home.classList.add('off');
  report.classList.remove('on');
  document.body.classList.remove('report-mode');
  run.classList.add('on');
  LIVE.pack = null;
  logEl.innerHTML = '';
  stagesEl.innerHTML = STAGE_NAMES.map(n => `<div class="st">${n}</div>`).join('');
  $('#logtarget').textContent = '对象：' + target.region + (target.industry ? ' · ' + target.industry : '') + ' · ' + DEPTH_NAME[DEPTH];
  t0 = Date.now();
  clearInterval(clock);
  clock = setInterval(() => {
    const pausedNow = LIVE.paused ? Date.now() - LIVE.pauseStarted : 0;
    const s = Math.floor((Date.now() - t0 - LIVE.pausedMs - pausedNow) / 1000);
    $('#elapsed').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 500);

  const q = target.label;
  buildGraph();
  document.getElementById('gn-input').classList.add('done');
  let live = null;
  try {
    live = new EventSource('/expo/api/run?place=' + encodeURIComponent(q) + '&depth=' + DEPTH
      + '&region=' + encodeURIComponent(target.region) + '&industry=' + encodeURIComponent(target.industry)
      + '&question=' + encodeURIComponent(target.question));
  } catch (e) { live = null; }
  if (!live) { startStatic(query); return; }
  LIVE.source = live;
  LIVE.place = { label: target.label, query: q };
  let opened = false, failed = false;
  live.onopen = () => { opened = true; };
  live.onerror = () => {
    if (failed || DONE_RECEIVED) { live.close(); return; }
    failed = true;
    live.close();
    if (!opened) { startStatic(query); }
    else handleEvent({ type: 'error', reason: 'stream_broken', detail: '连接中断' });
  };
  live.onmessage = e => {
    try { handleEvent(JSON.parse(e.data)); } catch (err) { /* ignore */ }
  };
}

  const key = pickPlace(query || 'yuhuan');
  const P = D.places[key] || D.places._generic;
  if (LIVE.source) LIVE.source.close();

  resetPlayback();
  LIVE.query = P.label;
  LIVE.place = { label: P.label, query: query || P.label };

  document.getElementById('gn-input').classList.add('done');
  home.classList.add('off');
  report.classList.remove('on');

  LIVE.pack = null;
  logEl.innerHTML = '';
  stagesEl.innerHTML = STAGE_NAMES.map(n => `<div class="st">${n}</div>`).join('');
  $('#logtarget').textContent = '对象：' + P.label + ' · 已有数据包回放';
  t0 = Date.now();

  clock = setInterval(() => {
    const pausedNow = LIVE.paused ? Date.now() - LIVE.pauseStarted : 0;
    const s = Math.floor((Date.now() - t0 - LIVE.pausedMs - pausedNow) / 1000);
    $('#elapsed').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 500);
  const think = async stage => {
    for (const progress of [0, 70, 140]) { showThink({ stage, progress }); await sleep(45); }
  };

    for (let k = 0; k < values.length; k++) {
      handleEvent({ type: 'activity', stage, kind, n: k + 1, label: label(values[k], k) });
      await sleep(35);
    }
  };
  await typeLog(`打开已有研究数据包：「${P.label}」× 好设计创新`);

  setStage(0, 'doing');
  await think(0);
  await items(0, 'theses', P.theses || [], x => '读取假设 ' + x.id);
  renderBlk(0, { theses: P.theses || [] });
  setStage(0, 'done');

  setStage(1, 'doing');
  await think(1);
  await items(1, 'sectors', P.sectors, x => '读取板块 · ' + x);
  await items(1, 'sources', P.sources || [], x => '读取来源 · ' + (x.title || '公开资料'));
  renderBlk(1, { headline: P.headline, intro: P.intro, sectors: P.sectors, drivers: P.drivers || [], boundary: P.boundary || '', sources: P.sources || [], note: P.note });
  setStage(1, 'done');

  setStage(2, 'doing');
  await think(2);
  const links = (P.chain || []).flatMap(t => (t.links || []).map(x => ({ tier: t.tier, text: x })));
  await items(2, 'links', links, x => '读取' + x.tier + '环节');
  await items(2, 'companies', P.companies, x => '读取企业 · ' + x.name);
  renderBlk(2, { chain: P.chain || [], companies: P.companies });
  setStage(2, 'done');

  setStage(3, 'doing');
  await think(3);
  await items(3, 'checked', P.theses || [], x => '读取核证 ' + x.id);
  await items(3, 'requirements', P.requirements, x => '读取需求 ' + x.id);
  renderBlk(3, { requirements: P.requirements, theses: P.theses || [] });
  setStage(3, 'done');

  setStage(4, 'doing');
  await think(4);
  const candidateIds = [...new Set(P.matches.flatMap(m => m.projects.map(p => p.id)))];
  await items(4, 'candidates', candidateIds, x => '读取候选 · ' + (pj(x) ? pj(x).name : x));
  renderBlk(4, { matches: P.matches, candidates: candidateIds.length });
  setStage(4, 'done');

  setStage(5, 'doing');
  await think(5);
  await items(5, 'opportunities', P.opportunities, x => '读取方向 · ' + x.title);
  renderBlk(5, { opportunities: P.opportunities });
  setStage(5, 'done');

  setStage(6, 'doing');
  await think(6);
  handleEvent({ type: 'pack', data: { label: P.label, slug: reportSlug(P.label), depth: P.depth || 'standard', headline: P.headline, intro: P.intro, sectors: P.sectors,
    drivers: P.drivers || [], summary_points: P.summary_points || [], theses: P.theses || [],
    boundary: P.boundary || '', sources: P.sources || [], chain: P.chain || [],
    companies: P.companies, note: P.note, personas: P.personas, requirements: P.requirements,
    matches: P.matches, opportunities: P.opportunities, risks: P.risks || [] } });
  await typeLog('报告已生成，证据与项目档案可回查', 'ok');
  setStage(6, 'done');
  handleEvent({ type: 'done' });
}

$('#again').addEventListener('click', () => {
  if (LIVE.source) LIVE.source.close();
  resetPlayback();
  report.classList.remove('on');
  document.body.classList.remove('report-mode');
  run.classList.remove('on');
  home.classList.remove('off');
  $('#q').value = '';
  $('#q').focus();
});
$('#back').addEventListener('click', () => location.reload());
$('#pause').addEventListener('click', togglePause);
$('#refresh').addEventListener('click', () => start(LIVE.query || (LIVE.pack && LIVE.pack.label), true));
$('#btn-save').addEventListener('click', saveReportHtml);
$('#btn-archive').addEventListener('click', archiveCurrent);
$('#btn-print').addEventListener('click', () => window.print());

function syncPresentationControls() {
  const active = document.body.classList.contains('expo-presenting');
  document.querySelectorAll('[data-expo-fullscreen]').forEach(button => button.setAttribute('aria-pressed', String(active)));
  $('#fullscreen-exit').setAttribute('aria-hidden', String(!active));
}
async function enterPresentation() {
  document.body.classList.add('expo-presenting');
  syncPresentationControls();
  if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
    try { await document.documentElement.requestFullscreen(); } catch (e) { /* 权限受限时保留纯净展示 */ }
  }
}
async function exitPresentation() {
  document.body.classList.remove('expo-presenting');
  syncPresentationControls();
  if (document.fullscreenElement && document.exitFullscreen) {
    try { await document.exitFullscreen(); } catch (e) { /* CSS 状态已退出 */ }
  }
}
function addPresentationEntry(parent, className = '') {
  if (!parent) return;
  const button = document.createElement('button');
  button.type = 'button';
  button.dataset.expoFullscreen = '';
  button.className = className;
  button.textContent = '全屏展示';
  button.setAttribute('aria-label', '进入纯净全屏展示');
  button.setAttribute('aria-pressed', 'false');
  button.addEventListener('click', enterPresentation);
  parent.appendChild(button);
}
addPresentationEntry($('.gd-nav-actions'), 'gd-button gd-button--quiet');
addPresentationEntry($('#run-controls'));
addPresentationEntry($('#rbar>div:last-child'), 'rbtn ghost');
$('#fullscreen-exit').addEventListener('click', exitPresentation);
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('expo-presenting', Boolean(document.fullscreenElement));
  syncPresentationControls();
});
syncPresentationControls();
addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    if (document.body.classList.contains('expo-presenting')) void exitPresentation();
    clearResearchFocus();
  }
});

const litReady = loadLit();
const startupParams = new URLSearchParams(location.search);
const requestedReport = startupParams.get('report');
const requestedVersion = startupParams.get('id') || '';
if (requestedReport) litReady.then(() => openReport(requestedReport, requestedVersion));
let idle = null;
function armIdle() {
  clearTimeout(idle);
  idle = setTimeout(() => {
    if (home.classList.contains('off') && !document.body.classList.contains('expo-presenting')) $('#again').click();
  }, 180000);
}
['keydown', 'click', 'mousemove'].forEach(ev => addEventListener(ev, armIdle, { passive: true }));
armIdle();
</script>
