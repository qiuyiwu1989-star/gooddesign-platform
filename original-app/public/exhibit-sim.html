<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>月面钻取任务 · 展厅大屏版 — 好设计馆</title>
<style>
  :root{
    --bg:#0E111A; --panel:#171B28; --panel2:#1E2436; --line:rgba(255,255,255,.09);
    --ink:#F2F3F7; --muted:#8E94A6; --accent:#5E6AD2; --accent-bright:#7C86E8; --gold:#D8B36A; --green:#5FA88A; --red:#E0685F;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"JetBrains Mono","SF Mono","Consolas",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:radial-gradient(ellipse 60% 50% at 50% 20%,#1B2140,#0E111A 75%);color:var(--ink);
    min-height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
  .top{height:72px;display:flex;align-items:center;gap:18px;padding:0 36px;border-bottom:1px solid var(--line)}
  .top .badge{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--gold);border:1px solid rgba(216,179,106,.4);border-radius:8px;padding:6px 14px}
  .top h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  .top .sub{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:1px}

  .main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,.8fr);gap:24px;padding:26px 36px;height:calc(100vh - 72px)}
  @media(max-width:1100px){.main{grid-template-columns:1fr;overflow:auto}.top .sub{display:none}}

  /* 剖面屏 */
  .screen{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}
  .screen .bar{height:52px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
  .screen .bar .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(95,168,138,.15)}
  .screen .bar b{color:var(--ink);font-family:var(--mono);font-weight:500}
  .screen svg{display:block;width:100%;height:calc(100% - 52px)}
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:rgba(10,13,22,.88);z-index:5;padding:30px}
  .overlay.show{display:flex;animation:fadeIn .3s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* 简报/复盘卡 */
  .brief{max-width:760px;text-align:center}
  .brief .k{font-family:var(--mono);font-size:13px;letter-spacing:3px;color:var(--gold)}
  .brief h2{font-size:clamp(28px,4vw,46px);margin:14px 0;letter-spacing:1px}
  .brief p{font-size:17px;color:var(--muted);line-height:1.9;max-width:640px}
  .brief .steps{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .brief .steps span{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9999px;padding:8px 18px}
  .big-btn{height:70px;padding:0 52px;border:none;border-radius:16px;background:var(--accent);color:#fff;
    font-size:22px;font-weight:800;cursor:pointer;font-family:var(--sans);letter-spacing:2px;transition:all .15s}
  .big-btn:hover{background:var(--accent-bright)}
  .big-btn.alt{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}

  /* 选址 */
  .sites{display:flex;gap:16px;max-width:980px;flex-wrap:wrap;justify-content:center}
  .site{width:280px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);padding:22px;cursor:pointer;transition:all .2s;text-align:left;font-family:var(--sans)}
  .site:hover{border-color:var(--accent-bright);transform:translateY(-3px)}
  .site .ico{font-size:34px}
  .site h3{font-size:20px;margin:10px 0 6px}
  .site .p{font-size:13px;color:var(--muted);line-height:1.7}
  .site .risk{display:inline-block;margin-top:12px;font-size:12px;padding:5px 12px;border-radius:9999px}
  .site .risk.low{background:rgba(95,168,138,.15);color:var(--green)}
  .site .risk.mid{background:rgba(216,179,106,.15);color:var(--gold)}
  .site .risk.high{background:rgba(224,104,95,.15);color:var(--red)}

  /* 事件卡 */
  .event{max-width:820px;width:100%;text-align:center}
  .event .tag{font-family:var(--mono);font-size:13px;letter-spacing:2px;color:var(--red)}
  .event h2{font-size:clamp(24px,3.4vw,38px);margin:12px 0 8px;line-height:1.3}
  .event .ctx{font-size:16px;color:var(--muted);line-height:1.8;margin-bottom:24px}
  .opts{display:flex;flex-direction:column;gap:12px;max-width:640px;width:100%;margin:0 auto}
  .opt{height:64px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--ink);
    font-size:19px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:all .15s;padding:0 24px}
  .opt:hover{border-color:var(--accent-bright)}
  .opt:disabled{opacity:.5;cursor:default}
  .opt.correct{border-color:var(--green);background:rgba(95,168,138,.18);color:var(--green)}
  .opt.wrong{border-color:var(--red);background:rgba(224,104,95,.14);color:var(--red)}
  .opt.ok{border-color:var(--gold);background:rgba(216,179,106,.14);color:var(--gold)}
  .timer{font-family:var(--mono);font-size:30px;color:var(--gold);margin-top:18px}
  .timer.low{color:var(--red)}
  .fb{margin-top:16px;font-size:16px;line-height:1.8;max-width:640px}
  .fb.good{color:var(--green)} .fb.bad{color:var(--red)} .fb.mid{color:var(--gold)}

  /* 右侧任务面板 */
  .console{display:flex;flex-direction:column;gap:18px}
  .panel{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:22px}
  .panel h2{font-size:13px;color:var(--muted);font-family:var(--mono);letter-spacing:2px;margin-bottom:16px}
  .stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat{background:var(--panel2);border-radius:12px;padding:14px 8px;text-align:center}
  .stat .v{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--accent-bright)}
  .stat .k{font-size:11px;color:var(--muted);margin-top:3px}
  .log{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:hidden}
  .log .li{font-size:13.5px;color:var(--muted);line-height:1.6;padding:9px 12px;border-radius:10px;background:var(--panel2)}
  .log .li.good{color:var(--green);border-left:3px solid var(--green)}
  .log .li.bad{color:var(--red);border-left:3px solid var(--red)}
  .log .li.info{color:var(--ink);border-left:3px solid var(--accent)}
  .status-txt{font-size:14px;color:var(--ink);line-height:1.7}
  .demo-hint{position:absolute;right:24px;bottom:20px;font-size:12px;color:rgba(142,148,166,.6);font-family:var(--mono)}
</style>
<link rel="stylesheet" href="/design/system.css"></head>
<body class="gd-site"><a class="gd-skip" href="#gd-content">跳到内容</a><div id="gd-shell" class="gd-header"><a class="gd-brand" href="/"><img src="/assets/brand/logo-seal.svg" alt="">好设计</a><button id="gd-menu" class="gd-menu" aria-expanded="false" aria-controls="gd-nav">菜单</button><div class="gd-nav" id="gd-nav" role="navigation" aria-label="全站导航"><a href="/projects.html">项目库</a><a href="/museum.html" aria-current="page">好设计馆</a><a href="/education.html">科技教育</a><a href="/assist.html">智能助手</a><a href="/industry.html">企业创新</a></div></div><div class="gd-crumb" id="gd-content" tabindex="-1"><a href="/">好设计平台</a> / <a href="/museum.html">好设计馆</a></div>

<div class="top">
  <span class="badge">好设计馆 · 展厅展项</span>
  <h1>月面钻取任务</h1>
  <span class="sub">EXHIBIT · LUNAR DRILLING MISSION · 决策内容基于官方设计阐述,教学模拟</span>
</div>

<div class="main">
  <div class="screen">
    <div class="bar"><span class="dot"></span>月面钻取作业 <b id="depthLabel">深度 0%</b></div>
    <svg id="simSvg" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="overlay" id="overlay"></div>
    <div class="demo-hint" id="demoHint">无人操作时将自动演示</div>
  </div>

  <div class="console">
    <div class="panel">
      <h2>任务面板 · MISSION</h2>
      <div class="stat-row">
        <div class="stat"><div class="v" id="stDepth">0%</div><div class="k">钻进深度</div></div>
        <div class="stat"><div class="v" id="stScore">--</div><div class="k">取芯成功率</div></div>
        <div class="stat"><div class="v" id="stLayer">--</div><div class="k">层序完整度</div></div>
      </div>
    </div>
    <div class="panel">
      <h2>任务日志 · LOG</h2>
      <div class="log" id="log"></div>
    </div>
    <div class="panel">
      <h2>状态 · STATUS</h2>
      <div class="status-txt" id="statusTxt">等待任务开始…</div>
    </div>
  </div>
</div>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  var NS = 'http://www.w3.org/2000/svg';
  var svg = $('simSvg');
  var LAYERS = [
    { y: 60,  h: 60, fill: '#C9A06B' }, { y: 120, h: 56, fill: '#B08D5C' },
    { y: 176, h: 66, fill: '#96744A', rock: 2 }, { y: 242, h: 60, fill: '#7E5F3C' },
    { y: 302, h: 66, fill: '#6A4F30', rock: 1 }, { y: 368, h: 60, fill: '#5C4530' },
    { y: 428, h: 66, fill: '#4E3A28' }, { y: 494, h: 60, fill: '#42301F' }, { y: 554, h: 66, fill: '#382817' }
  ];
  var drillG;
  function buildScene(){
    svg.innerHTML = '';
    var bg = document.createElementNS(NS, 'rect');
    bg.setAttribute('width', 900); bg.setAttribute('height', 620); bg.setAttribute('fill', '#151927');
    svg.appendChild(bg);
    svg.innerHTML += '<text x="450" y="38" text-anchor="middle" font-size="15" fill="#8E94A6">模拟月壤剖面(含未知岩块)</text>';
    LAYERS.forEach(function(l){
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', 180); r.setAttribute('y', l.y); r.setAttribute('width', 540); r.setAttribute('height', l.h);
      r.setAttribute('fill', l.fill); r.setAttribute('rx', 4);
      svg.appendChild(r);
      for (var k = 0; k < (l.rock || 0); k++) {
        var rock = document.createElementNS(NS, 'circle');
        rock.setAttribute('cx', 260 + k * 260); rock.setAttribute('cy', l.y + l.h * (0.3 + k * 0.3));
        rock.setAttribute('r', 26); rock.setAttribute('fill', '#3A2F20');
        svg.appendChild(rock);
      }
    });
    var g = document.createElementNS(NS, 'g');
    g.innerHTML =
      '<rect x="-14" y="-130" width="28" height="130" fill="#B9BECB" rx="5"/>' +
      '<path d="M-30 0 L-24 -46 L-14 -46 L-14 -106 L14 -106 L14 -46 L24 -46 L30 0 Z" fill="#B08936"/>' +
      '<circle cx="0" cy="-74" r="7" fill="#4F58C0"/>';
    g.setAttribute('transform', 'translate(450,110)');
    svg.appendChild(g);
    drillG = g;
  }
  buildScene();

  /* 音效(Web Audio,无外部文件) */
  var AC = null;
  function beep(freq, dur, vol){
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.value = vol || 0.12;
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + dur);
    } catch(e){}
  }
  function sOk(){ beep(880, .18); beep(1320, .22); }
  function sBad(){ beep(220, .3); beep(180, .35); }
  function sTick(){ beep(520, .05, .05); }

  /* 状态 */
  var overlay = $('overlay');
  var log = $('log');
  var state = 'idle';  // idle | brief | site | drill | event | result
  var score = 60, layer = 100, site = null, eventsDone = 0;
  var RUNNING = false;

  function logAdd(txt, cls){
    var d = document.createElement('div');
    d.className = 'li ' + (cls || 'info');
    d.textContent = txt;
    log.insertBefore(d, log.firstChild);
    while (log.children.length > 6) log.removeChild(log.lastChild);
  }
  function setStatus(txt){ $('statusTxt').textContent = txt; }

  /* ---------- 阶段 1:任务简报 ---------- */
  function showBrief(){
    state = 'brief';
    overlay.innerHTML =
      '<div class="brief">' +
        '<div class="k">LUNAR DRILLING MISSION · 任务简报</div>' +
        '<h2>把月壤完好取回来</h2>' +
        '<p>你是钻取系统指挥员。嫦娥任务要在 38 万公里外、无法实时遥控的条件下,钻取 2 米深、保住层序的月壤样芯。' +
        '你将在钻进过程中面对 5 个突发决策——选错了,任务就可能中断。</p>' +
        '<div class="steps"><span>① 选择采样点</span><span>② 钻进作业</span><span>③ 突发决策 ×5</span><span>④ 复盘</span></div>' +
        '<div style="margin-top:26px"><button class="big-btn" id="bGo">开始任务 →</button></div>' +
      '</div>';
    overlay.classList.add('show');
    $('bGo').addEventListener('click', function(){ beep(660,.15); showSite(); });
  }

  /* ---------- 阶段 2:选址 ---------- */
  var SITES = [
    { ico: '🌗', nm: '风暴洋 · 吕姆克山区', p: '嫦娥五号实际采样区。玄武质月壤,地质学年龄最年轻。', risk: '中', riskCls: 'mid', hint: '地形相对平缓,岩块概率中等' },
    { ico: '🌑', nm: '艾特肯盆地 · 阿波罗撞击坑', p: '嫦娥六号实际采样区。月球背面,玄武质-斜长质混杂月壤。', risk: '高', riskCls: 'high', hint: '地形起伏大,岩块概率高,但样品价值最高' },
    { ico: '🌕', nm: '高地平坦区', p: '地形最平缓、岩块最少,但样品价值一般。', risk: '低', riskCls: 'low', hint: '好钻,但科研价值有限' }
  ];
  function showSite(){
    state = 'site';
    overlay.innerHTML =
      '<div class="brief"><div class="k">STEP 1 · 选择采样点</div><h2>在哪里下钻?</h2>' +
      '<p>月面有三个候选采样点。地形、岩块概率和样品价值各不相同——你会选哪里?</p></div>' +
      '<div class="sites">' + SITES.map(function(s, i){
        return '<div class="site" data-i="' + i + '"><div class="ico">' + s.ico + '</div><h3>' + s.nm + '</h3>' +
          '<div class="p">' + s.p + '</div><span class="risk ' + s.riskCls + '">风险:' + s.risk + '</span></div>';
      }).join('') + '</div>';
    overlay.classList.add('show');
    Array.prototype.forEach.call(overlay.querySelectorAll('.site'), function(el){
      el.addEventListener('click', function(){
        var i = +this.getAttribute('data-i');
        site = i;
        beep(660, .15);
        var bonus = i === 2 ? 0 : (i === 0 ? 4 : 6);
        score = 60 + bonus;
        logAdd('采样点已选定:' + SITES[i].nm + (bonus ? '(+' + bonus + ' 成功率)' : ''), 'good');
        overlay.classList.remove('show');
        startDrill();
      });
    });
  }

  /* ---------- 阶段 3:钻进 + 事件 ---------- */
  var EVENTS = [
    { depth: 0.24, title: '⚠ 遇到硬岩块!', ctx: '钻头阻力骤增——剖面里藏着 50mm 厚的 Ⅷ级月岩。你怎么应对?',
      opts: [
        { t: '自动切换冲击破岩', cls: 'correct', fb: '✓ 正确!内刃多点冲击突破岩块,外刃切削破碎——「冲-切-排-拨-挤」组合工艺正是为此设计。' },
        { t: '加大转速硬钻', cls: 'wrong', fb: '✗ 硬钻会卡死钻头,还会烧毁驱动。官方从不硬碰硬——见硬就冲。' },
        { t: '暂停观察等指令', cls: 'ok', fb: '△ 保守但浪费时间:38 万公里时延下单程就要 1.3 秒,任务窗口不等人。' }
      ] },
    { depth: 0.42, title: '⚠ 驱动电流异常!', ctx: '钻进中电流读数突然升高——可能是月尘卡进了机构。你的处置?',
      opts: [
        { t: '降速并启动状态检查', cls: 'correct', fb: '✓ 正确!官方用驱动电流、编码器等复用信息实时辨识状态,欠资源条件下最大化监测。' },
        { t: '无视继续钻', cls: 'wrong', fb: '✗ 电流异常往往预示卡滞前兆,继续硬钻可能烧毁电机。' },
        { t: '立即停机', cls: 'ok', fb: '△ 安全但损失进度:停机-复检-重启会占用任务节拍,影响样芯品质。' }
      ] },
    { depth: 0.58, title: '⚠ 通信中断!', ctx: '中继卫星进入不可测控弧段——接下来最长 8 小时联系不上地面。钻不钻?',
      opts: [
        { t: '按预案盲钻继续', cls: 'correct', fb: '✓ 正确!这正是官方的「无通信盲钻」——在轨预编程 30 种规程组合自主寻优。' },
        { t: '干等信号恢复', cls: 'wrong', fb: '✗ 8 小时不可测控弧段,等待会让整个任务窗口报废。' },
        { t: '放慢速度谨慎钻', cls: 'ok', fb: '△ 稳妥但保守:自主预编程本就能保证安全,无需过度减速。' }
      ] },
    { depth: 0.74, title: '⚠ 月尘堵塞排屑!', ctx: '排屑通道压力升高——极细的月尘正在卡进螺旋槽。怎么办?',
      opts: [
        { t: '反转螺旋排尘', cls: 'correct', fb: '✓✓ 最优解!官方钻具的螺旋栅格排尘结构正是为此设计,反转即排尘。' },
        { t: '提速甩掉月尘', cls: 'wrong', fb: '✗ 提速只会让样芯在管内颠簸,层序被打乱——「取得多」不如「取得好」。' },
        { t: '提钻人工清理', cls: 'ok', fb: '△ 能救,但提钻-清理-再下钻的节拍损失,样芯品质会打折。' }
      ] },
    { depth: 0.9, title: '⚠ 样芯接近满管!', ctx: '软袋即将装满——样芯的层序信息还完好地包在里面。此刻?',
      opts: [
        { t: '触发封口收纳', cls: 'correct', fb: '✓ 正确!多道异构封口(塑性回弹+八字簧)自动密闭,层序完整保留——这是官方取芯率的秘密。' },
        { t: '再钻深一点', cls: 'wrong', fb: '✗ 满管再钻,样芯会被挤压错位,前功尽弃。' },
        { t: '先看看再说', cls: 'ok', fb: '△ 犹豫会让软袋过载,封口机构可能错过最佳时机。' }
      ] }
  ];
  var eventIdx = 0;

  function startDrill(){
    state = 'drill';
    eventIdx = 0;
    logAdd('任务开始:钻进作业启动', 'info');
    setStatus('表层钻进:渐阔排屑槽排出岩屑…');
    var t0 = performance.now(), dur = 14000, progress = 0;
    RUNNING = true;
    function frame(now){
      if (state !== 'drill') return;
      progress = Math.min(1, (now - t0) / dur);
      drillG.setAttribute('transform', 'translate(450,' + (110 + 470 * progress) + ')');
      $('depthLabel').textContent = '深度 ' + Math.round(progress * 100) + '%';
      $('stDepth').textContent = Math.round(progress * 100) + '%';
      if (eventIdx < EVENTS.length && progress >= EVENTS[eventIdx].depth) {
        showEvent(eventIdx);
        return;
      }
      if (progress >= 1) { finishMission(true); return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function showEvent(idx){
    state = 'event';
    var ev = EVENTS[idx];
    drillG.setAttribute('transform', 'translate(450,' + (110 + 470 * ev.depth) + ')');
    setStatus(ev.title);
    var timeLeft = 10, answered = false;
    overlay.innerHTML =
      '<div class="event">' +
        '<div class="tag">' + ev.title + '</div>' +
        '<div class="ctx">' + ev.ctx + '</div>' +
        '<div class="opts">' + ev.opts.map(function(o, i){
          return '<button class="opt" data-i="' + i + '">' + o.t + '</button>';
        }).join('') + '</div>' +
        '<div class="timer" id="evTimer">⏱ ' + timeLeft + 's</div>' +
        '<div class="fb" id="evFb"></div>' +
      '</div>';
    overlay.classList.add('show');
    var timer = setInterval(function(){
      timeLeft--;
      var t = $('evTimer');
      if (t) { t.textContent = '⏱ ' + timeLeft + 's'; t.classList.toggle('low', timeLeft <= 3); }
      if (timeLeft <= 3 && timeLeft > 0) sTick();
      if (timeLeft <= 0) {
        clearInterval(timer);
        if (!answered) choose(idx, -1);
      }
    }, 1000);
    Array.prototype.forEach.call(overlay.querySelectorAll('.opt'), function(b){
      b.addEventListener('click', function(){
        if (answered) return;
        answered = true;
        clearInterval(timer);
        choose(idx, +this.getAttribute('data-i'));
      });
    });
  }

  function choose(idx, choice){
    var ev = EVENTS[idx];
    var opts = overlay.querySelectorAll('.opt');
    Array.prototype.forEach.call(opts, function(o){ o.disabled = true; });
    var fb = $('evFb');
    var result = { cls: 'bad', score: 0, layer: 0, msg: '⏱ 超时未响应!风险陡增。' };
    if (choice >= 0) {
      var o = ev.opts[choice];
      if (o.cls === 'correct') { result = { cls: 'good', score: 10, layer: 0, msg: o.fb }; sOk(); }
      else if (o.cls === 'ok') { result = { cls: 'mid', score: 4, layer: -5, msg: o.fb }; beep(440, .2); }
      else { result = { cls: 'bad', score: 0, layer: -20, msg: o.fb }; sBad(); }
      opts[choice].classList.add(o.cls);
    } else {
      sBad();
    }
    score += result.score; layer = Math.max(20, layer + result.layer);
    fb.className = 'fb ' + result.cls;
    fb.textContent = result.msg;
    logAdd('事件「' + ev.title.replace('⚠ ', '') + '」:' + (result.cls === 'good' ? '处置得当' : result.cls === 'mid' ? '保守处置' : '处置不当') + (result.score ? ' (+' + result.score + ')' : ''), result.cls);
    $('stScore').textContent = score + '%';
    $('stLayer').textContent = layer + '%';
    eventsDone++;
    setTimeout(function(){
      overlay.classList.remove('show');
      eventIdx++;
      if (eventIdx >= EVENTS.length) { finishMission(true); }
      else {
        state = 'drill';
        setStatus('继续钻进:软袋包覆样芯,无滑差收进…');
        var t0 = performance.now();
        var base = EVENTS[eventIdx - 1].depth + 0.02;
        var dur = 4000;
        (function frame(now){
          if (state !== 'drill') return;
          var p = Math.min(1, (now - t0) / dur);
          var prog = Math.min(EVENTS[eventIdx].depth, base + (EVENTS[eventIdx].depth - base) * p);
          drillG.setAttribute('transform', 'translate(450,' + (110 + 470 * prog) + ')');
          $('depthLabel').textContent = '深度 ' + Math.round(prog * 100) + '%';
          $('stDepth').textContent = Math.round(prog * 100) + '%';
          if (prog >= EVENTS[eventIdx].depth - 0.001) { showEvent(eventIdx); return; }
          requestAnimationFrame(frame);
        })(performance.now());
      }
    }, 3600);
  }

  /* ---------- 阶段 4:复盘 ---------- */
  function finishMission(ok){
    RUNNING = false;
    state = 'result';
    drillG.setAttribute('transform', 'translate(450,580)');
    $('depthLabel').textContent = '深度 100%';
    $('stDepth').textContent = '100%';
    var rating = score >= 88 ? { t: '🏆 完美钻取', s: '与官方方案高度一致——你就是那位指挥员。' } :
                 score >= 72 ? { t: '🌟 顺利完成任务', s: '关键决策基本正确,层序完整。' } :
                 score >= 55 ? { t: '⚠ 有惊无险', s: '部分决策欠妥,样芯品质打了折扣。' } :
                 { t: '💥 任务受损', s: '多处处置不当——去拆解实验室看看官方设计,再来一次。' };
    var right = EVENTS.filter(function(_, i){ return i < eventsDone; }).length;
    overlay.innerHTML =
      '<div class="brief">' +
        '<div class="k">MISSION COMPLETE · 任务复盘</div>' +
        '<h2>' + rating.t + '</h2>' +
        '<p>' + rating.s + '</p>' +
        '<div class="steps">' +
          '<span>取芯成功率 <b style="color:var(--accent-bright)">' + score + '%</b></span>' +
          '<span>层序完整度 <b style="color:var(--green)">' + layer + '%</b></span>' +
          '<span>决策响应 ' + eventsDone + '/5</span>' +
        '</div>' +
        '<div style="margin-top:24px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap">' +
          '<button class="big-btn" id="bAgain">再试一次</button>' +
          '<button class="big-btn alt" id="bPaper">看官方图纸</button>' +
        '</div>' +
      '</div>';
    overlay.classList.add('show');
    $('bAgain').addEventListener('click', function(){ beep(660,.15); showBrief(); });
    $('bPaper').addEventListener('click', function(){ window.location.href = 'x-ray.html?slug=2025-00'; });
    logAdd('任务结束:' + rating.t, score >= 72 ? 'good' : 'bad');
  }

  /* ---------- 启动 ---------- */
  showBrief();
  /* 无人自动演示:40 秒无操作 → 自动播一遍(自动选正确解) */
  var IDLE = 40000, timer = null;
  function wake(){
    clearTimeout(timer);
    $('demoHint').textContent = '无人操作时将自动演示';
    timer = setTimeout(autoDemo, IDLE);
  }
  function autoDemo(){
    $('demoHint').textContent = '自动演示中…';
    if (state === 'drill' || state === 'event') return;
    overlay.classList.remove('show');
    score = 60; layer = 100; eventsDone = 0;
    logAdd('自动演示:按官方方案执行', 'info');
    var t0 = performance.now(), dur = 12000, progress = 0;
    state = 'drill';
    function frame(now){
      if (state !== 'drill') { wake(); return; }
      progress = Math.min(1, (now - t0) / dur);
      drillG.setAttribute('transform', 'translate(450,' + (110 + 470 * progress) + ')');
      $('depthLabel').textContent = '深度 ' + Math.round(progress * 100) + '%';
      $('stDepth').textContent = Math.round(progress * 100) + '%';
      var d = EVENTS[eventIdx];
      if (d && progress >= d.depth) {
        eventIdx++;
        score += 10;
        $('stScore').textContent = score + '%';
        $('stLayer').textContent = layer + '%';
        logAdd('自动处置:『' + d.title.replace('⚠ ', '') + '』→ 官方方案', 'good');
        setStatus(d.title.replace('⚠ ', '') + ' → 按官方预案处置');
        beep(660, .1);
      }
      if (progress >= 1) {
        eventsDone = 5;
        finishMission(true);
        wake();
        return;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  document.addEventListener('click', wake, true);
  document.addEventListener('touchstart', wake, true);
})();
</script>
