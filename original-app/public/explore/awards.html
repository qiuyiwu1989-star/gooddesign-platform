<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奖项与作品对照｜好设计</title><link rel="stylesheet" href="style.css"><header><a class="brand" href="/">好设计馆。</a><a href="/award.html">奖项背景</a><a href="/laureates.html">原有获奖名录</a><a href="museum.html">主题导览</a></header><main><p class="eyebrow">AWARDS / PROJECT ARCHIVE</p><h1>从获奖名录，<br>走进作品本身。</h1><p class="intro">按年份、奖级和单位寻找作品；选取最多三项，比较档案里记载的问题、内容和资料完整性。</p><p class="note">本页统计现有560条历史档案，不代表逐项完成官方复核。2022年不在当前数据中，不能据此判断该年是否评奖。对照不等同技术优劣排名。</p><div class="filters"><label>项目名称或单位<input id="query" type="search" placeholder="例如：机器人、天津大学"></label><label>年份<select id="year"><option value="">全部年份</option></select></label><label>奖级<select id="award"><option value="">全部奖级</option></select></label><label>资料情况<select id="coverage"><option value="">全部档案</option><option value="archive_text">有原文描述</option><option value="missing">描述待补充</option></select></label><button id="clear" type="button">清除筛选</button></div><p id="status" role="status">正在读取档案…</p><section class="tray" aria-label="作品对照"><h2>作品对照</h2><p id="selected">尚未选择作品。</p><div id="comparison" class="compare-wrap"></div></section><div id="results" class="grid"></div><button id="load-more" hidden>再显示24项</button><noscript>请启用JavaScript使用筛选和对照；也可访问原有获奖名录。</noscript></main><script src="awards.js"></script></html>
